[project]
name = "convex-to-pydantic"
version = "0.1.0"
description = "Pydantic codegen from Convex schemas. Requires Node.js ≥18 on PATH."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "watchdog>=3.0",
]

[project.scripts]
convex-to-pydantic = "convex_to_pydantic.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/convex_to_pydantic"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "ty>=0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ty.environment]
python-version = "3.11"
