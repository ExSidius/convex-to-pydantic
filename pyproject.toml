[project]
name = "convex-to-pydantic"
dynamic = ["version"]
description = "Pydantic codegen from Convex schemas. Requires Node.js ≥18 on PATH."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "watchdog>=3.0",
]

[project.scripts]
convex-to-pydantic = "convex_to_pydantic.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/convex_to_pydantic/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/convex_to_pydantic"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "ty>=0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_docker: test requires a running Docker daemon (for self-hosted Convex backend)",
    "requires_pnpm: test requires pnpm and node on PATH",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ty.environment]
python-version = "3.11"
